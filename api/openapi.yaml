openapi: 3.0.3
info:
  title: k8s-capacity-report API
  version: "1"
  description: >-
    The HTTP contract of the serve command. Every route is under /api/v1.
    Errors have one shape, Error, whose message is a fixed English sentence
    chosen by the code; a client shows its own translation of the code.
    The health routes /health/live and /health/ready are outside this
    contract and need no session. Every GET route also answers HEAD, after
    the same checks, without a body. The 412 and 416 of the three downloads
    are answered by the HTTP layer, outside the Error shape.
servers:
  - url: /api/v1
security:
  - cookieAuth: []
paths:
  /auth/session:
    get:
      operationId: getSession
      summary: The session state and, for an anonymous caller, the sign-in CSRF token.
      security: []
      responses:
        "200":
          description: >-
            Anonymous (AnonymousSession, with the cookie kcr_login_csrf set) or
            signed in (SignedInSession, with a fresh csrf_token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "403":
          description: >-
            A request from another site (`Sec-Fetch-Site` neither `same-origin`
            nor `none`); nothing is rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Unexpected"
  /auth/login:
    post:
      operationId: login
      summary: Sign in with a local account.
      security: []
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in. Sets the cookie kcr_session and clears kcr_login_csrf.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedInSession"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          description: INVALID_CREDENTIALS.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/CSRFRejected"
        "429":
          description: AUTH_RATE_LIMITED, with Retry-After in seconds.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Unexpected"
  /auth/logout:
    post:
      operationId: logout
      summary: Sign out.
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "204":
          description: Signed out. Clears the cookie kcr_session.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRFRejected"
        default:
          $ref: "#/components/responses/Unexpected"
  /account:
    patch:
      operationId: changeAccount
      summary: Change the reader's own password or language.
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountChange"
      responses:
        "200":
          description: >-
            The account after the change. When the password changed, every
            session of the reader is revoked and the cookie kcr_session is
            cleared in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          description: UNAUTHENTICATED, or INVALID_CREDENTIALS when the current password is wrong or missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/CSRFRejected"
        "422":
          $ref: "#/components/responses/PasswordPolicy"
        "429":
          description: AUTH_RATE_LIMITED, with Retry-After in seconds.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Unexpected"
  /admin/users:
    get:
      operationId: listUsers
      summary: Every user, in name order.
      responses:
        "200":
          description: The users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Unexpected"
    post:
      operationId: createUser
      summary: Create a user.
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewUser"
      responses:
        "201":
          description: The user created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCSRF"
        "409":
          description: USERNAME_TAKEN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/UsernameOrPasswordPolicy"
        default:
          $ref: "#/components/responses/Unexpected"
  /admin/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: getUser
      summary: One user.
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        default:
          $ref: "#/components/responses/Unexpected"
    patch:
      operationId: changeUser
      summary: Change a user's role, active flag, password, or language.
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserChange"
      responses:
        "200":
          description: The user after the change. A change that moves nothing returns the user unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCSRF"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "409":
          description: SELF_DEACTIVATE, SELF_DEMOTE, or LAST_ADMIN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/PasswordPolicy"
        default:
          $ref: "#/components/responses/Unexpected"
    delete:
      operationId: deactivateUser
      summary: Deactivate a user and revoke every session of theirs.
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "204":
          description: Deactivated.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCSRF"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "409":
          description: SELF_DELETE or LAST_ADMIN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Unexpected"
  /profiles:
    get:
      operationId: listActiveProfiles
      summary: The active profiles as summaries, in id order, for any signed-in reader.
      responses:
        "200":
          description: The summaries, with the four defaults resolved to the fallback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSummaryList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/Unexpected"
  /admin/profiles:
    get:
      operationId: listProfiles
      summary: Every profile with a current revision, active or not, in id order.
      responses:
        "200":
          description: The profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Unexpected"
    post:
      operationId: createProfile
      summary: Create a profile, as its first revision.
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileCreate"
      responses:
        "201":
          description: The profile created, with its endpoint in canonical form.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCSRF"
        "409":
          $ref: "#/components/responses/ProfileIDTaken"
        "422":
          $ref: "#/components/responses/ProfileRefused"
        default:
          $ref: "#/components/responses/Unexpected"
  /admin/profiles/{id}:
    parameters:
      - $ref: "#/components/parameters/ProfileID"
    get:
      operationId: getProfile
      summary: One profile, its current revision.
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ProfileNotFound"
        default:
          $ref: "#/components/responses/Unexpected"
    patch:
      operationId: reviseProfile
      summary: Revise a profile from the revision it was read at, as a new revision.
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileChange"
      responses:
        "200":
          description: >-
            The profile after the change. A change that moves nothing returns
            the current revision and writes none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCSRF"
        "404":
          $ref: "#/components/responses/ProfileNotFound"
        "409":
          $ref: "#/components/responses/ProfileRevisionStale"
        "422":
          $ref: "#/components/responses/ProfileRefused"
        default:
          $ref: "#/components/responses/Unexpected"
    delete:
      operationId: deleteProfile
      summary: Delete a profile by clearing its pointer; every revision is kept.
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCSRF"
        "404":
          $ref: "#/components/responses/ProfileNotFound"
        default:
          $ref: "#/components/responses/Unexpected"
  /admin/profiles/{id}/test:
    parameters:
      - $ref: "#/components/parameters/ProfileID"
    post:
      operationId: testProfile
      summary: >-
        Run the preflight of a report against the source of the profile,
        through the outbound policy, and answer the outcome as a code.
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "200":
          description: >-
            The outcome, whatever it is: ok with PROFILE_OK, or not ok with
            one of the codes of ProfileTestResult. Never a URL, a name, an
            address, or the text of a failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileTestResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCSRF"
        "404":
          $ref: "#/components/responses/ProfileNotFound"
        default:
          $ref: "#/components/responses/Unexpected"
  /admin/profiles/test:
    post:
      operationId: testProfileDraft
      summary: >-
        Run the preflight of a report against the source of a draft profile,
        through the outbound policy, before it is saved; answer the outcome as
        a code.
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileDraft"
      responses:
        "200":
          description: >-
            The outcome, whatever it is: ok with PROFILE_OK, or not ok with
            one of the codes of ProfileTestResult. Never a URL, a name, an
            address, or the text of a failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileTestResult"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCSRF"
        "422":
          $ref: "#/components/responses/ProfileRefused"
        default:
          $ref: "#/components/responses/Unexpected"
  /reports:
    get:
      operationId: listReports
      summary: >-
        The reports that are not deleted, newest first, one page at a time,
        for any signed-in reader.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: >-
            One page. An expired report that is not yet purged is listed with
            expired true; next_cursor is null on the last page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportPage"
        "400":
          description: CURSOR_INVALID, or REQUEST_INVALID with the field limit invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/Unexpected"
    post:
      operationId: requestReport
      summary: >-
        Request a report of a profile; an operator or an administrator. The
        same Idempotency-Key with the same body answers the report it
        created, as it is now.
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequest"
      responses:
        "202":
          description: Accepted, or replayed with replayed true.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportAccepted"
        "400":
          description: >-
            IDEMPOTENCY_KEY_INVALID when the header is missing or malformed;
            REQUEST_INVALID with one field per problem of the body (missing,
            invalid, repeated, empty, unknown, conflict, order, future).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCSRF"
        "404":
          description: >-
            PROFILE_NOT_FOUND; or REPORT_NOT_FOUND when the key names a report
            that was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: IDEMPOTENCY_KEY_REUSED with another body, or PROFILE_INACTIVE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: REPORT_EXPIRED when the key names a report that expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            REPORT_SELECTION_NOT_PERMITTED, with one field per value the
            profile does not permit (not_permitted).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: >-
            ADMISSION_GLOBAL_LIMIT or ADMISSION_PROFILE_LIMIT, with Retry-After
            in whole seconds, at least 1.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Unexpected"
  /reports/delete:
    post:
      operationId: deleteReports
      summary: >-
        Delete up to 200 reports in one transaction: an administrator any, an
        operator its own requests. One outcome per id, in the order sent.
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportDeleteRequest"
      responses:
        "200":
          description: The outcomes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDeleteResults"
        "400":
          description: >-
            REQUEST_INVALID with the field ids: empty, too_many (over 200),
            repeated, or invalid (a value that is not a UUID). Nothing is
            deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCSRF"
        default:
          $ref: "#/components/responses/Unexpected"
  /reports/{id}:
    parameters:
      - $ref: "#/components/parameters/ReportID"
    get:
      operationId: getReport
      summary: One report, its request and its progress, for any signed-in reader.
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ReportNotFound"
        "410":
          $ref: "#/components/responses/ReportExpired"
        default:
          $ref: "#/components/responses/Unexpected"
    delete:
      operationId: deleteReport
      summary: >-
        Delete a report: an administrator any, an operator its own request.
        An expired report can be deleted too. From then on the report answers
        REPORT_NOT_FOUND everywhere.
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCSRF"
        "404":
          $ref: "#/components/responses/ReportNotFound"
        default:
          $ref: "#/components/responses/Unexpected"
  /reports/{id}/view:
    parameters:
      - $ref: "#/components/parameters/ReportID"
    get:
      operationId: viewReport
      summary: >-
        The report worded in one language for the web, narrowed as its PDF
        is, for any signed-in reader.
      parameters:
        - $ref: "#/components/parameters/Lang"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The view.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportView"
        "206":
          $ref: "#/components/responses/PartialContent"
        "304":
          $ref: "#/components/responses/NotModified"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
        "400":
          $ref: "#/components/responses/LangInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ReportNotFound"
        "409":
          $ref: "#/components/responses/SnapshotNotReady"
        "410":
          $ref: "#/components/responses/ReportExpired"
        default:
          $ref: "#/components/responses/Unexpected"
  /reports/{id}/snapshot:
    parameters:
      - $ref: "#/components/parameters/ReportID"
    get:
      operationId: getReportSnapshot
      summary: >-
        The stored snapshot of a report, byte for byte as it was written, for
        any signed-in reader.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The snapshot, as an attachment named report-<id>.json.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Content-Disposition:
              $ref: "#/components/headers/ContentDisposition"
          content:
            application/json:
              schema:
                type: object
                description: >-
                  The snapshot contract of the program, the input of
                  --from-snapshot. Not narrowed.
        "206":
          $ref: "#/components/responses/PartialContent"
        "304":
          $ref: "#/components/responses/NotModified"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ReportNotFound"
        "409":
          $ref: "#/components/responses/SnapshotNotReady"
        "410":
          $ref: "#/components/responses/ReportExpired"
        default:
          $ref: "#/components/responses/Unexpected"
  /reports/{id}/pdf:
    parameters:
      - $ref: "#/components/parameters/ReportID"
    get:
      operationId: getReportPDF
      summary: The PDF of one language of a report, for any signed-in reader.
      parameters:
        - $ref: "#/components/parameters/Lang"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The PDF, as an attachment named report-<id>-<lang>.pdf.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Content-Disposition:
              $ref: "#/components/headers/ContentDisposition"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "206":
          $ref: "#/components/responses/PartialContent"
        "304":
          $ref: "#/components/responses/NotModified"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
        "400":
          $ref: "#/components/responses/LangInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ReportNotFound"
        "409":
          description: >-
            SNAPSHOT_NOT_READY when the report is not collected; PDF_NOT_READY
            when the PDF of the language is not ready, with the field status
            (pending or failed) and, for a failed PDF, failure_code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          $ref: "#/components/responses/ReportExpired"
        default:
          $ref: "#/components/responses/Unexpected"
  /reports/{id}/pdfs:
    parameters:
      - $ref: "#/components/parameters/ReportID"
    post:
      operationId: requestReportPDF
      summary: >-
        Make the PDF of one language of a collected report; an operator or an
        administrator. The PDF is created when it was never asked for and
        compiled again when it failed; a PDF that is pending is accepted and
        changes nothing.
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PDFRequest"
      responses:
        "202":
          description: The PDF is pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PDFRequestAccepted"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCSRF"
        "404":
          $ref: "#/components/responses/ReportNotFound"
        "409":
          description: >-
            SNAPSHOT_NOT_READY when the report is not collected;
            PDF_ALREADY_READY when the PDF is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          $ref: "#/components/responses/ReportExpired"
        default:
          $ref: "#/components/responses/Unexpected"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: kcr_session
  parameters:
    ReportID:
      name: id
      in: path
      required: true
      description: The identifier of a report; a malformed one answers REPORT_NOT_FOUND.
      schema:
        type: string
        format: uuid
        x-go-type: uuid.UUID
        x-go-type-import:
          path: github.com/google/uuid
    Lang:
      name: lang
      in: query
      required: true
      description: The language of the view or of the PDF.
      schema:
        $ref: "#/components/schemas/Language"
    Cursor:
      name: cursor
      in: query
      required: false
      description: The next_cursor of the previous page; left out for the first page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Chosen by the client for one request, and scoped to the requester; 1
        to 128 letters, digits, dots, underscores, colons, or hyphens.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: >-
        One entity tag, a list of them, or *, matched by the weak comparison
        of RFC 9110. It is read only after the reader is known to be allowed
        to read a report that is ready; it never turns a 404, 409, or 410
        into a 304.
      schema:
        type: string
    CSRFHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: >-
        On POST /auth/login, the value of the cookie kcr_login_csrf; on every
        other state-changing route, the csrf_token of the session.
      schema:
        type: string
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: uuid.UUID
        x-go-type-import:
          path: github.com/google/uuid
    ProfileID:
      name: id
      in: path
      required: true
      description: The identifier of a profile, a reference name of 1 to 63 characters.
      schema:
        type: string
        maxLength: 63
  headers:
    ETag:
      description: >-
        A strong entity tag: the SHA-256, in lower-case hex and in quotes, of
        the bytes of the body.
      schema:
        type: string
    CacheControl:
      description: private, no-cache.
      schema:
        type: string
    ContentDisposition:
      description: attachment, with the file name of the download.
      schema:
        type: string
  responses:
    ReportNotFound:
      description: REPORT_NOT_FOUND, for an unknown, malformed, deleted, or purged id.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ReportExpired:
      description: REPORT_EXPIRED, from expires_at until the report is purged.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SnapshotNotReady:
      description: SNAPSHOT_NOT_READY, while the report is not collected.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LangInvalid:
      description: REQUEST_INVALID with the field lang, missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PartialContent:
      description: >-
        The byte range a Range header asked for, with Content-Range, answered
        after the reader is known to be allowed to read the report.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
    PreconditionFailed:
      description: >-
        An If-Match that names another tag; no body. Answered after the reader
        is known to be allowed to read the report.
    RangeNotSatisfiable:
      description: >-
        A Range outside the body, with Content-Range, in plain text as RFC 9110
        answers it, not in the Error shape. Answered after the reader is known
        to be allowed to read the report.
    NotModified:
      description: The tag matches; no body.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
    RequestInvalid:
      description: REQUEST_INVALID, with one field per problem (missing, invalid, unknown, too_long).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: UNAUTHENTICATED.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CSRFRejected:
      description: CSRF_REJECTED.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: FORBIDDEN.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ForbiddenOrCSRF:
      description: FORBIDDEN or CSRF_REJECTED.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UserNotFound:
      description: USER_NOT_FOUND.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PasswordPolicy:
      description: PASSWORD_TOO_SHORT or PASSWORD_TOO_LONG.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UsernameOrPasswordPolicy:
      description: INVALID_USERNAME, PASSWORD_TOO_SHORT, or PASSWORD_TOO_LONG.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unexpected:
      description: INTERNAL_ERROR, DATABASE_UNAVAILABLE, NOT_FOUND, or METHOD_NOT_ALLOWED.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProfileNotFound:
      description: PROFILE_NOT_FOUND, for an unknown, malformed, or deleted id.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProfileIDTaken:
      description: PROFILE_ID_TAKEN.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProfileRevisionStale:
      description: PROFILE_REVISION_STALE, when base_revision_id is not the current revision.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProfileRefused:
      description: >-
        PROFILE_DOCUMENT_INVALID, with one field per problem (missing, invalid,
        repeated, empty, not_permitted, incoherent); or ENDPOINT_URL_REJECTED or
        ENDPOINT_ADDRESS_REJECTED, with the field endpoint_url marked invalid.
        A value is never repeated.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    ReportStatus:
      type: string
      enum: [queued, running, collected, failed]
    ReportPhase:
      type: string
      description: >-
        waiting while queued; preflight, collecting, analyzing, or
        snapshotting while running; rendering or complete once collected;
        complete once failed.
      enum: [waiting, preflight, collecting, analyzing, snapshotting, rendering, complete]
    ReportFailureCode:
      type: string
      description: Why a report failed; a client words the code.
      enum:
        - ENDPOINT_URL_REJECTED
        - ENDPOINT_ADDRESS_REJECTED
        - ENDPOINT_RESOLUTION_FAILED
        - ENDPOINT_CONNECTION_REJECTED
        - ENDPOINT_REDIRECT_REJECTED
        - PROFILE_CREDENTIAL_UNAVAILABLE
        - PROFILE_CA_BUNDLE_UNAVAILABLE
        - ENDPOINT_TLS_FAILED
        - ENDPOINT_AUTH_REJECTED
        - ENDPOINT_API_NOT_FOUND
        - ENDPOINT_UNREACHABLE
        - CLUSTER_SCOPE_NOT_FOUND
        - CAPABILITIES_INSUFFICIENT
        - SOURCE_VALUES_OUT_OF_RANGE
        - NOTHING_TO_REPORT
        - SNAPSHOT_TOO_LARGE
        - COLLECTION_TIMEOUT
        - JOB_ATTEMPTS_EXHAUSTED
        - INTERNAL_FAILURE
    PDFStatus:
      type: string
      enum: [pending, ready, failed]
    PDFFailureCode:
      type: string
      description: Why a PDF failed; a client words the code.
      enum: [PDF_COMPILE_FAILED, PDF_TOO_LARGE, PDF_ATTEMPTS_EXHAUSTED, INTERNAL_FAILURE]
    ReportPDFState:
      type: object
      required: [language, status, failure_code]
      properties:
        language:
          $ref: "#/components/schemas/Language"
        status:
          $ref: "#/components/schemas/PDFStatus"
        failure_code:
          allOf:
            - $ref: "#/components/schemas/PDFFailureCode"
          nullable: true
          description: Set when status is failed.
    ReportSelection:
      type: object
      description: The selection the report runs, with every default resolved.
      required: [namespaces, period, start, end, timezone, report_profile, min_severity, language]
      properties:
        namespaces:
          type: array
          items:
            type: string
        period:
          type: string
          nullable: true
          description: The length of the period; null for a calendar range.
        start:
          type: string
          nullable: true
          description: The first wall time of a calendar range, in the report's time zone; null for a length.
        end:
          type: string
          nullable: true
          description: The last wall time of a calendar range, in the report's time zone; null for a length.
        timezone:
          type: string
        report_profile:
          $ref: "#/components/schemas/ReportProfile"
        min_severity:
          $ref: "#/components/schemas/MinSeverity"
        language:
          $ref: "#/components/schemas/Language"
    ReportRequest:
      type: object
      description: A selection; a field left out or null takes the profile's default, except the language, which is required.
      required: [profile_id, language]
      properties:
        profile_id:
          type: string
          maxLength: 63
        language:
          $ref: "#/components/schemas/Language"
        namespaces:
          type: array
          nullable: true
          items:
            type: string
        period:
          type: string
          nullable: true
        start:
          type: string
          nullable: true
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}$"
          description: The first wall time of a calendar range, in the request's resolved time zone; sent with end, never with period.
        end:
          type: string
          nullable: true
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}$"
          description: The last wall time of a calendar range, in the request's resolved time zone; at or before the request time.
        timezone:
          type: string
          nullable: true
        report_profile:
          type: string
          nullable: true
          description: detailed or executive.
        min_severity:
          type: string
          nullable: true
          description: all, attention, or critical.
    ReportAccepted:
      type: object
      required: [id, status, phase, expires_at, replayed]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        status:
          $ref: "#/components/schemas/ReportStatus"
        phase:
          $ref: "#/components/schemas/ReportPhase"
        expires_at:
          type: string
          format: date-time
        replayed:
          type: boolean
          description: True when the key named a report already created.
    ReportSummary:
      type: object
      description: A report as the list shows it.
      required:
        - id
        - owner_id
        - owner_username
        - profile_id
        - status
        - phase
        - failure_code
        - pdfs
        - created_at
        - completed_at
        - expires_at
        - expired
        - selection
      properties:
        id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        owner_id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        owner_username:
          type: string
        profile_id:
          type: string
        status:
          $ref: "#/components/schemas/ReportStatus"
        phase:
          $ref: "#/components/schemas/ReportPhase"
        failure_code:
          allOf:
            - $ref: "#/components/schemas/ReportFailureCode"
          nullable: true
          description: Set when status is failed.
        pdfs:
          type: array
          description: One per language, in language order; empty until the collection ends.
          items:
            $ref: "#/components/schemas/ReportPDFState"
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
        expired:
          type: boolean
          description: >-
            expires_at is at or before now: the report answers REPORT_EXPIRED
            until it is purged.
        selection:
          allOf:
            - $ref: "#/components/schemas/ReportSelection"
          nullable: true
          description: >-
            null in the list when the stored request cannot be read; the
            report itself then answers 500.
    Report:
      description: A report with its request and its progress.
      allOf:
        - $ref: "#/components/schemas/ReportSummary"
        - type: object
          required: [profile_revision_id, attempt, started_at, collected_at, selection]
          properties:
            selection:
              $ref: "#/components/schemas/ReportSelection"
            profile_revision_id:
              type: string
              format: uuid
              x-go-type: uuid.UUID
              x-go-type-import:
                path: github.com/google/uuid
            attempt:
              type: integer
              description: The collection attempt that runs or ran it; 0 before the first.
            started_at:
              type: string
              format: date-time
              nullable: true
            collected_at:
              type: string
              format: date-time
              nullable: true
    ReportPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReportSummary"
        next_cursor:
          type: string
          nullable: true
          description: The cursor of the next page; null on the last page.
    PDFRequest:
      type: object
      required: [language]
      properties:
        language:
          $ref: "#/components/schemas/Language"
    PDFRequestAccepted:
      type: object
      required: [language, status]
      properties:
        language:
          $ref: "#/components/schemas/Language"
        status:
          $ref: "#/components/schemas/PDFStatus"
    ReportDeleteRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items:
            type: string
            format: uuid
            x-go-type: uuid.UUID
            x-go-type-import:
              path: github.com/google/uuid
    ReportDeleteOutcome:
      type: string
      description: >-
        deleted, an expired report included; not_found for an unknown or
        already deleted id; forbidden for an operator's request of a report
        another requested.
      enum: [deleted, not_found, forbidden]
    ReportDeleteResult:
      type: object
      required: [id, outcome]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        outcome:
          $ref: "#/components/schemas/ReportDeleteOutcome"
    ReportDeleteResults:
      type: object
      required: [results]
      properties:
        results:
          type: array
          description: One per id sent, in the order sent.
          items:
            $ref: "#/components/schemas/ReportDeleteResult"
    Error:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    ErrorCode:
      type: string
      description: A code of the contract; the interface shows its own translation.
      x-go-type: Code
      enum:
        - REQUEST_INVALID
        - INVALID_CREDENTIALS
        - UNAUTHENTICATED
        - CSRF_REJECTED
        - FORBIDDEN
        - USER_NOT_FOUND
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - USERNAME_TAKEN
        - LAST_ADMIN
        - SELF_DELETE
        - SELF_DEACTIVATE
        - SELF_DEMOTE
        - INVALID_USERNAME
        - PASSWORD_TOO_SHORT
        - PASSWORD_TOO_LONG
        - AUTH_RATE_LIMITED
        - DATABASE_UNAVAILABLE
        - PROFILE_NOT_FOUND
        - PROFILE_ID_TAKEN
        - PROFILE_REVISION_STALE
        - PROFILE_DOCUMENT_INVALID
        - ENDPOINT_URL_REJECTED
        - ENDPOINT_ADDRESS_REJECTED
        - INTERNAL_ERROR
        - IDEMPOTENCY_KEY_INVALID
        - CURSOR_INVALID
        - REPORT_NOT_FOUND
        - IDEMPOTENCY_KEY_REUSED
        - PROFILE_INACTIVE
        - SNAPSHOT_NOT_READY
        - PDF_NOT_READY
        - PDF_ALREADY_READY
        - REPORT_EXPIRED
        - REPORT_SELECTION_NOT_PERMITTED
        - ADMISSION_GLOBAL_LIMIT
        - ADMISSION_PROFILE_LIMIT
    ErrorBody:
      type: object
      required: [code, message, fields]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: A fixed English sentence chosen by the code, never text from an exception.
        fields:
          type: object
          description: The field problems of a REQUEST_INVALID answer; empty otherwise.
          additionalProperties:
            type: string
    Role:
      type: string
      enum: [administrator, operator, reader]
    Language:
      type: string
      enum: [pt-BR, en]
    Principal:
      type: object
      required: [id, username, role, language]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        language:
          $ref: "#/components/schemas/Language"
    Session:
      description: The answer of GET /auth/session, one of the two shapes.
      oneOf:
        - $ref: "#/components/schemas/AnonymousSession"
        - $ref: "#/components/schemas/SignedInSession"
    AnonymousSession:
      type: object
      required: [authenticated, login_csrf]
      properties:
        authenticated:
          type: boolean
          description: Always false in this shape.
        login_csrf:
          type: string
          description: The sign-in CSRF token, also set as the cookie kcr_login_csrf.
    SignedInSession:
      type: object
      required: [authenticated, principal, csrf_token, expires_at]
      properties:
        authenticated:
          type: boolean
          description: Always true in this shape.
        principal:
          $ref: "#/components/schemas/Principal"
        csrf_token:
          type: string
          description: The token to send as X-CSRF-Token on every state-changing request.
        expires_at:
          type: string
          format: date-time
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 256
        password:
          type: string
          maxLength: 1024
    AccountChange:
      type: object
      properties:
        current_password:
          type: string
          maxLength: 1024
          description: Required with password.
        password:
          type: string
          maxLength: 1024
        language:
          $ref: "#/components/schemas/Language"
    User:
      type: object
      required: [id, username, role, language, active, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        language:
          $ref: "#/components/schemas/Language"
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
    NewUser:
      type: object
      required: [username, password, role, language]
      properties:
        username:
          type: string
          maxLength: 256
        password:
          type: string
          maxLength: 1024
        role:
          $ref: "#/components/schemas/Role"
        language:
          $ref: "#/components/schemas/Language"
    UserChange:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/Role"
        active:
          type: boolean
        password:
          type: string
          maxLength: 1024
        language:
          $ref: "#/components/schemas/Language"
    EndpointType:
      type: string
      enum: [auto, prometheus, grafana]
    FilterMode:
      type: string
      enum: [required, auto, none]
    NodeAutoscaling:
      type: string
      enum: [auto, enabled, disabled]
    ReportProfile:
      type: string
      enum: [detailed, executive]
    MinSeverity:
      type: string
      enum: [all, attention, critical]
    ProfileThresholds:
      type: object
      description: The seven thresholds of a report; a key left out keeps its value.
      properties:
        warning_percent:
          type: number
          format: double
        critical_percent:
          type: number
          format: double
        low_utilization_percent:
          type: number
          format: double
        autoscaler_near_max_percent:
          type: number
          format: double
        nodepool_spread_points:
          type: number
          format: double
        bursty_gap_percent:
          type: number
          format: double
        hpa_replica_divergence:
          type: number
          format: double
    ProfileDocument:
      type: object
      description: >-
        A profile as an administrator writes it and as a revision stores it.
        A credential and a CA bundle are named by file name, resolved under the
        folders of the deployment when a report runs, never here.
      properties:
        display_name:
          type: string
          maxLength: 128
        active:
          type: boolean
          description: Defaults to false.
        endpoint_url:
          type: string
          maxLength: 2048
          description: Stored in canonical form after the outbound policy accepts it.
        endpoint_type:
          $ref: "#/components/schemas/EndpointType"
        timeout_seconds:
          type: number
          format: double
          description: Over 0 and at most 600; defaults to 90.
        tls_verify:
          type: boolean
          description: Defaults to true.
        credential_file:
          type: string
          maxLength: 63
          description: A file name under the credential folder; empty means no credential.
        ca_bundle_file:
          type: string
          maxLength: 63
          description: A file name under the CA bundle folder; empty means none; refused while tls_verify is false.
        cluster_name:
          type: string
          maxLength: 253
        cluster_label:
          type: string
          description: A Prometheus label name; defaults to cluster.
        filter_mode:
          $ref: "#/components/schemas/FilterMode"
        nodepool_label:
          type: string
          description: A Prometheus label name, or empty.
        node_autoscaling:
          $ref: "#/components/schemas/NodeAutoscaling"
        allowed_namespaces:
          type: array
          items:
            type: string
        excluded_containers:
          type: array
          items:
            type: string
        permitted_periods:
          type: array
          description: Empty means unrestricted.
          items:
            type: string
        default_period:
          type: string
          nullable: true
          description: Null means 24h; must be within permitted_periods when that list is not empty.
        permitted_timezones:
          type: array
          items:
            type: string
        default_timezone:
          type: string
          nullable: true
          description: Null means America/Sao_Paulo.
        permitted_report_profiles:
          type: array
          items:
            $ref: "#/components/schemas/ReportProfile"
        default_report_profile:
          type: string
          nullable: true
          description: detailed or executive; null means detailed.
        permitted_min_severities:
          type: array
          items:
            $ref: "#/components/schemas/MinSeverity"
        default_min_severity:
          type: string
          nullable: true
          description: all, attention, or critical; null means all.
        thresholds:
          $ref: "#/components/schemas/ProfileThresholds"
    ProfileCreate:
      description: The body of POST /admin/profiles; a field left out takes its default.
      allOf:
        - $ref: "#/components/schemas/ProfileDocument"
        - type: object
          required: [id, display_name, endpoint_url, cluster_name, allowed_namespaces]
          properties:
            id:
              type: string
              maxLength: 63
