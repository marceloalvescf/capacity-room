        the findings, recommendations, and the namespace, workload, and node
        rows below the effective minimum are left out; the HPAs, node pools,
        summary counts, and quality are whole. Every text is the text the PDF
        prints for the same quantity. A closed set travels as its code, which
        a client words.
      required:
        - language
        - min_severity
        - report
        - summary
        - findings
        - recommendations
        - verdict
        - namespaces
        - workloads
        - hpas
        - nodes
        - nodepools
        - quality
