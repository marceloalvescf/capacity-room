          $ref: "#/components/schemas/Language"
        min_severity:
          $ref: "#/components/schemas/MinSeverity"
        report:
          $ref: "#/components/schemas/ViewReport"
        summary:
          $ref: "#/components/schemas/ViewSummary"
        findings:
          type: array
          items:
            $ref: "#/components/schemas/ViewFinding"
        recommendations:
          type: array
          description: The rows of the PDF's action plan, in its order.
          items:
            $ref: "#/components/schemas/ViewRecommendation"
        verdict:
          $ref: "#/components/schemas/ViewVerdict"
        namespaces:
          type: array
          items:
            $ref: "#/components/schemas/ViewNamespace"
        workloads:
          type: array
          items:
            $ref: "#/components/schemas/ViewWorkload"
        hpas:
          type: array
          items:
            $ref: "#/components/schemas/ViewHPA"
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/ViewNode"
        nodepools:
          type: array
          items:
            $ref: "#/components/schemas/ViewNodepool"
        quality:
          $ref: "#/components/schemas/ViewQuality"
