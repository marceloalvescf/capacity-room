[metrics]
url = "https://prom.example.org/api/v1"
token_env = "CAPACITYROOM_FULL_TOKEN"
tls_verify = false
ca_bundle = "testdata/ca.pem"
timeout_seconds = 45

[cluster]
name = "prod"
namespaces = ["payments", "billing"]
label = "k8s_cluster"
filter_mode = "auto"
nodepool_label = "nodepool"

[analysis]
period = "7d"
timezone = "UTC"
node_autoscaling = "enabled"
excluded_containers = ["istio-proxy"]

[thresholds]
warning_percent = 60
critical_percent = 90
low_utilization_percent = 20
autoscaler_near_max_percent = 75
nodepool_spread_points = 15
bursty_gap_percent = 50
hpa_replica_divergence = 2

[report]
profile = "executive"
language = "en"
organization = "Acme"
classification = "internal"
author = "Test Author"
output_directory = "testdata"
