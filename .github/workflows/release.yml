name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: release
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_READ_TOKEN: ${{ secrets.DOCKERHUB_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Read the version
        run: echo "V=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
      - name: Check the tag
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v$V" || { echo "tag $GITHUB_REF_NAME is not v$V"; exit 1; }
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag || { echo "tag $GITHUB_REF_NAME is not annotated"; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tagged commit is not on main"; exit 1; }
      - name: Check the changelog
        run: grep -qF "## [$V] - " CHANGELOG.md || { echo "CHANGELOG.md has no heading for $V"; exit 1; }
      - name: Log in to Docker Hub with the read token
        if: env.DOCKERHUB_READ_TOKEN != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_READ_TOKEN }}
      - name: Gate
        run: nix develop --command make gate
      - name: Audit
        run: nix develop --command make audit
      - name: Log in to Docker Hub for the push
        if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_WRITE_TOKEN }}
      - name: Push the image
        id: image
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          ref="docker.io/alvesmarcelocf/capacity-room:$V"
          docker tag "capacity-room:$V" "$ref"
          docker push "$ref"
          repo_digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$ref")"
          echo "digest=${repo_digest#*@}" >> "$GITHUB_OUTPUT"
      - name: Attest the image
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/alvesmarcelocf/capacity-room
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Push the chart
        id: chart
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # shellcheck disable=SC2016
          nix develop --command bash -c '
            set -euo pipefail
            rm -rf .cache/chart-package
            mkdir -p .cache/chart-package
            helm package deploy/helm/capacity-room --destination .cache/chart-package
            test "$(ls .cache/chart-package)" = "capacity-room-$V.tgz"
            printf "%s" "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            helm push ".cache/chart-package/capacity-room-$V.tgz" oci://ghcr.io/marceloalvescf/charts 2>&1 | tee .cache/chart-push.log
            digest="$(sed -n "s/^Digest: //p" .cache/chart-push.log)"
            test -n "$digest"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          '
      - name: Attest the chart
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/marceloalvescf/charts/capacity-room
          subject-digest: ${{ steps.chart.outputs.digest }}
          # Helm's registry login is not Docker's, so the attestation stays in
          # the repository's attestation store, where `gh attestation verify`
          # reads it.
          push-to-registry: false
      - name: Create the draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache
          awk -v head="## [$V] - " 'index($0, "## [") == 1 { if (found) exit; if (index($0, head) == 1) found = 1 } found' CHANGELOG.md > .cache/release-notes.md
          test -s .cache/release-notes.md
          gh release create "v$V" --draft --title "v$V" --notes-file .cache/release-notes.md --verify-tag
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-logs-${{ env.V }}
          path: |
            .cache/gate/
            .cache/audit/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
