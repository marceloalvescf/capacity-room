version: "2"

linters:
  default: none
  enable:
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  exclusions:
    paths:
      - older
      - .cache
    rules:
      # Test files quote Portuguese text from fixtures, which the English
      # spelling check reads as typing errors.
      - path: _test\.go
        linters:
          - misspell

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - older
      - .cache
