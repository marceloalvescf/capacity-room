# The end-to-end stack of `make e2e`, over compose.yaml. The one-shot services
# are run by the make target, in order; serve does not wait for them.
name: capacity-room-e2e

x-one-shot: &one-shot
  image: capacity-room:${CAPACITYROOM_VERSION:?set CAPACITYROOM_VERSION}
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  environment:
    CAPACITYROOM_DATABASE_DSN: postgres://capacityroom:${CAPACITYROOM_POSTGRES_PASSWORD:?set CAPACITYROOM_POSTGRES_PASSWORD to the database password}@postgres:5432/capacityroom?sslmode=disable
  volumes:
    - ${CAPACITYROOM_CONFIG_DIR:?set CAPACITYROOM_CONFIG_DIR to the folder holding platform.toml and server-secret}:/etc/capacity-room:ro
  depends_on:
    postgres:
      condition: service_healthy

x-fake: &fake
  image: capacity-room-fake-prometheus:${CAPACITYROOM_VERSION:?set CAPACITYROOM_VERSION}
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  volumes:
    - ../testdata/prometheus:/fixtures:ro
  healthcheck:
    test: ["CMD", "/usr/local/bin/fake-prometheus", "--probe", "http://127.0.0.1:9090/-/ready"]
    interval: 1s
    timeout: 3s
    retries: 30

services:
  fake-prometheus:
    <<: *fake
    command: ["--fixture", "/fixtures/direct-complete.json", "--listen", ":9090"]

  fake-recovery:
    <<: *fake
    command: ["--fixture", "/fixtures/direct-complete.json", "--listen", ":9090", "--delay", "150ms"]

  serve:
    depends_on:
      fake-prometheus:
        condition: service_healthy
      fake-recovery:
        condition: service_healthy

  worker:
    image: capacity-room-worker-e2e:${CAPACITYROOM_VERSION:?set CAPACITYROOM_VERSION}
    environment:
      CAPACITYROOM_TYPST: /usr/local/bin/typst-switch
    volumes:
      - switch:/switch:ro
    depends_on:
      fake-prometheus:
        condition: service_healthy
      fake-recovery:
        condition: service_healthy

  migrate:
    <<: *one-shot
    command: ["admin", "migrate", "--config", "/etc/capacity-room/platform.toml"]

  bootstrap:
    <<: *one-shot
    environment:
      CAPACITYROOM_DATABASE_DSN: postgres://capacityroom:${CAPACITYROOM_POSTGRES_PASSWORD:?set CAPACITYROOM_POSTGRES_PASSWORD to the database password}@postgres:5432/capacityroom?sslmode=disable
      CAPACITYROOM_BOOTSTRAP_MODE: "1"
    command:
      - admin
      - bootstrap-admin
      - --username
      - e2e-admin
      - --language
      - en
      - --password-stdin
      - --config
      - /etc/capacity-room/platform.toml

  profiles:
    <<: *one-shot
    command: ["admin", "import-profiles", "--config", "/etc/capacity-room/platform.toml", "--file", "/etc/capacity-room/profiles.toml"]

  playwright:
    image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    network_mode: service:serve
    depends_on:
      serve:
        condition: service_healthy
    working_dir: /web
    volumes:
      - ../web:/web:ro
      - web-node-modules:/web/node_modules
      - ../.cache/e2e:/results
      - switch:/switch
    command: ["sh", "-c", ": > /results/secrets.txt && npm ci && npx playwright test"]

volumes:
  web-node-modules:
  switch:

networks:
  # The e2e project takes a range of its own, so it runs beside a deployment.
  default:
    ipam:
      config:
        - subnet: 172.31.214.0/24
