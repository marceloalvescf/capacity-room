# The platform: PostgreSQL, the web server, and the worker. The image is the
# runtime image of the version in CAPACITYROOM_VERSION. The postgres image is pinned by
# tag and by index digest, as the Containerfile pins its bases.
name: capacity-room

x-app: &app
  image: capacity-room:${CAPACITYROOM_VERSION:?set CAPACITYROOM_VERSION}
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  environment:
    CAPACITYROOM_DATABASE_DSN: postgres://capacityroom:${CAPACITYROOM_POSTGRES_PASSWORD:?set CAPACITYROOM_POSTGRES_PASSWORD to the database password}@postgres:5432/capacityroom?sslmode=disable
  volumes:
    - ${CAPACITYROOM_CONFIG_DIR:?set CAPACITYROOM_CONFIG_DIR to the folder holding platform.toml and server-secret}:/opt/capacity-room:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: capacityroom
      POSTGRES_USER: capacityroom
      POSTGRES_PASSWORD: ${CAPACITYROOM_POSTGRES_PASSWORD:?set CAPACITYROOM_POSTGRES_PASSWORD to the database password}
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capacityroom -d capacityroom"]
      interval: 1s
      timeout: 3s
      retries: 30

  serve:
    <<: *app
    # The stop waits 30 seconds for the requests in flight, then closes the
    # rest; the grace period covers that wait with room to exit.
    stop_grace_period: 45s
    command: ["serve", "--config", "/opt/capacity-room/platform.toml", "--listen", ":8080"]
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/capacity-room", "admin", "probe", "http://127.0.0.1:8080/health/ready"]
      interval: 2s
      timeout: 6s
      retries: 30

  worker:
    <<: *app
    # The stop waits worker_drain_seconds (30 by default) for the jobs, cancels
    # the rest, and waits as long again; the grace period covers both waits.
    stop_grace_period: 75s
    command: ["worker", "--config", "/opt/capacity-room/platform.toml", "--health-listen", ":8091"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/capacity-room", "admin", "probe", "http://127.0.0.1:8091/health/ready"]
      interval: 2s
      timeout: 6s
      retries: 30

volumes:
  postgres-data:

networks:
  # A fixed subnet, so that a TLS proxy on the host reaches serve from the
  # known gateway 172.31.213.1, which trusted_proxies names. An operator whose
  # networks already use this range changes it in an override file, with
  # trusted_proxies.
  default:
    ipam:
      config:
        - subnet: 172.31.213.0/24
