apiVersion: v1
kind: Service
metadata:
  name: {{ include "capacity-room.fullname" . }}
  labels:
    {{- include "capacity-room.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "capacity-room.selectorLabels" (dict "root" . "component" "serve") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
