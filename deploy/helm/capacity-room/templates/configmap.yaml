apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "capacity-room.fullname" . }}
  labels:
    {{- include "capacity-room.labels" . | nindent 4 }}
data:
  platform.toml: |
    {{- include "capacity-room.platformToml" . | nindent 4 }}
  {{- with .Values.profiles }}
  profiles.toml: |
    {{- include "capacity-room.profilesToml" $ | nindent 4 }}
  {{- end }}
